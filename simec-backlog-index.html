/* Tema claro alinhado ao painel de treinamentos. */
body.maintenance{background:#f0f5f8;color:#243746;--maintenance:#0057b8}
.maintenance header{background:#fff;color:#0057b8;border-bottom:5px solid #0057b8;padding:26px 28px}
.maintenance .brand-caption strong{color:#0057b8;font-weight:700}
.maintenance .brand-caption small,.maintenance .head-right{color:#697985}
.maintenance .portal-back,.maintenance header button{color:#0057b8;background:#fff;border:1px solid #dfe5ec;border-radius:7px}
.maintenance .portal-back:hover,.maintenance header button:hover{background:#edf4ff}
.maintenance nav{background:#f0f5f8;margin:18px 28px 0;padding:0;gap:10px;border-bottom:1px solid #dce3e9}
.maintenance nav button{color:#697985;padding:15px 18px;background:transparent;border-bottom:3px solid transparent}
.maintenance nav button:hover{color:#0057b8;background:#e8f0fa}
.maintenance nav button.active{color:#0057b8;border-bottom:3px solid #0057b8;background:transparent}
.maintenance main{max-width:none;padding:20px 28px 28px;display:flex;flex-direction:column}
.maintenance .filters{order:0;margin-bottom:20px;padding:16px;gap:12px}
.maintenance .filters label{font-size:14px;color:#697985}
.maintenance .filters select,.maintenance .filters button{color:#184575;border-color:#dfe5ec}
.maintenance .page-heading{order:1;color:#0057b8;margin:0 0 18px;align-items:center}
.maintenance .page-heading h1{font-size:20px;margin:0;font-weight:650}
.maintenance .count{color:#697985;font-size:14px}
.maintenance #content{order:2}
.maintenance .method{order:3;color:#697985}
.maintenance .panel{border:1px solid #dfe5ec;border-top:3px solid #0057b8;border-radius:12px;padding:20px}
.maintenance .panel h2{color:#0057b8;font-weight:650;font-size:18px}
.maintenance .metric{color:#0057b8}
.maintenance .gauge text{fill:#0057b8}
.maintenance .meta{color:#697985}
.maintenance footer{border-color:#dfe5ec;color:#697985;margin:0 28px}
.maintenance .notice{background:#e7f0fc;border-left-color:#0057b8;color:#284d70}
.maintenance .method a{color:#0057b8}
@media(max-width:750px){.maintenance header{padding:22px 18px}.maintenance nav{margin:14px 18px 0}.maintenance main{padding:18px}.maintenance .page-heading h1{font-size:19px}.maintenance .filters{padding:14px}.maintenance footer{margin:0 18px}.maintenance .head-right{gap:10px}}
/* Indicadores periodicos compactos, abaixo dos graficos. */
.maintenance #content:has(> .cards > .gauge-panel){display:flex;flex-direction:column}
.maintenance #content:has(> .cards > .gauge-panel) > .charts{display:contents}
.maintenance #content:has(> .cards > .gauge-panel) > .charts > .panel{order:0;margin-bottom:20px}
.maintenance #content:has(> .cards > .gauge-panel) > .cards{order:1;width:100%;max-width:850px;align-self:center;gap:14px;margin:0 0 20px}
.maintenance #content:has(> .cards > .gauge-panel) > .charts > .panel:has(table){order:2}
.maintenance .cards > .gauge-panel{padding:12px 14px}
.maintenance .cards > .gauge-panel h2{font-size:15px;margin-bottom:3px}
.maintenance .cards > .gauge-panel .gauge{height:118px;max-width:220px}
.maintenance .cards > .gauge-panel .meta{font-size:12px;line-height:1.5}
@media(max-width:600px){.maintenance #content:has(> .cards > .gauge-panel) > .cards{max-width:320px}.maintenance .cards > .gauge-panel .gauge{height:110px}}
.maintenance #content:has(> .cards > .gauge-panel) > .quantity-cards{order:-1;max-width:none;align-self:stretch;margin-bottom:20px}.maintenance .quantity-cards .panel{padding:18px 20px}.maintenance .quantity-cards .metric{font-size:38px;margin:10px 0 5px}
.export-toolbar{display:flex;align-items:center;justify-content:flex-end;gap:14px;margin:-4px 0 16px;flex-wrap:wrap}.export-toolbar button{display:inline-flex;align-items:center;gap:8px;color:#fff;background:#167242;border:1px solid #167242;font-weight:600}.export-toolbar button:hover{background:#105c34}.export-toolbar button span{font-size:23px;line-height:1}.export-toolbar>span{color:#697985;font-size:13px}
.portal-brand{display:flex;align-items:center;gap:18px}.ladle-animation{position:relative;width:76px;height:100px;overflow:visible}.ladle-motion{position:absolute;inset:0;overflow:hidden;transform-origin:65% 23%;animation:ladle-pour 3.8s ease-in-out infinite}.ladle-motion img{position:absolute;width:230px;max-width:none;height:108px;right:0;top:-4px;mix-blend-mode:multiply}.molten-glow{position:absolute;left:22px;bottom:10px;width:15px;height:5px;border-radius:50%;background:#ff781c;box-shadow:0 0 12px 4px #ff9b3655;animation:steel-glow 1.2s ease-in-out infinite alternate}.access-card:hover,.access-card:focus-visible{border-top-color:#ff6424;box-shadow:0 13px 30px #172f4c20;transform:translateY(-4px)}.access-card:hover .access-bottom,.access-card:focus-visible .access-bottom,.access-card:hover .access-icon,.access-card:focus-visible .access-icon{color:#ee591c}.access-card:hover .access-icon{background:#fff0e8}.access-bottom>span{transition:transform .2s,color .2s}.access-card:hover .access-bottom>span{transform:translateX(5px);color:#ff6424}.portal-brand:hover .ladle-motion{animation-duration:1.8s;filter:drop-shadow(0 0 4px #ff842a55)}
@keyframes ladle-pour{0%,100%{transform:rotate(0deg)}35%,65%{transform:rotate(-13deg) translateY(1px)}80%{transform:rotate(-4deg)}}@keyframes steel-glow{from{opacity:.45;transform:scale(.8)}to{opacity:1;transform:scale(1.25);box-shadow:0 0 16px 6px #ff7f3555}}@media(prefers-reduced-motion:reduce){.ladle-motion,.molten-glow{animation:none}.access-card:hover,.access-card:focus-visible{transform:none}.access-bottom>span{transition:none}}

.portal-brand .ladle-user-animation{display:block;width:120px;height:120px;object-fit:contain;flex:none}
@media(max-width:600px){.portal-brand .ladle-user-animation{width:96px;height:96px}}

/* Cabecalho do portal: logo esquerda, titulo central, panela direita. */
.portal-header-inner{display:grid;grid-template-columns:200px minmax(0,1fr) 180px;grid-template-rows:1fr auto auto 1fr;column-gap:24px;min-height:210px;padding-top:22px;padding-bottom:22px;align-items:center}
.portal-brand{display:contents}
.portal-brand .simec-mark{grid-column:1;grid-row:1/5;align-self:center}
.portal-brand .ladle-user-animation{grid-column:3;grid-row:1/5;width:170px;height:170px;justify-self:end;align-self:center}
.portal-header h1{grid-column:2;grid-row:2;margin:0 0 10px;text-align:center;font-size:30px}
.portal-header p{grid-column:2;grid-row:3;text-align:center;line-height:1.5;margin:0}
@media(max-width:750px){.portal-header-inner{grid-template-columns:130px minmax(0,1fr) 120px;column-gap:12px;padding:18px;min-height:180px}.portal-brand .simec-mark{width:130px;height:58px}.portal-brand .ladle-user-animation{width:120px;height:120px}.portal-header h1{font-size:23px}.portal-header p{font-size:13px}}
@media(max-width:520px){.portal-header-inner{grid-template-columns:1fr 1fr;grid-template-rows:auto auto auto;gap:8px 16px}.portal-brand .simec-mark{grid-column:1;grid-row:1}.portal-brand .ladle-user-animation{grid-column:2;grid-row:1;width:130px;height:130px}.portal-header h1{grid-column:1/3;grid-row:2;margin:4px 0}.portal-header p{grid-column:1/3;grid-row:3;margin-bottom:12px}}

/* Referencia visual do video: panela compacta junto ao logo. */
.portal-topbar{background:#141b62;color:white;text-align:center;padding:13px 20px;font-size:16px;font-weight:600;line-height:1.4}
.portal-header-inner{display:block;min-height:0;padding:24px 32px 28px}
.portal-brand{display:flex;align-items:center;gap:24px}
.portal-brand .simec-mark{width:184px;height:74px}
.portal-brand .ladle-animation{width:76px;height:100px;flex:none}
.portal-header h1{text-align:left;margin:18px 0 8px;font-size:30px}
.portal-header p{text-align:left;margin:0;font-size:14px}
.portal-header{border-bottom:2px solid #191e70}
.portal-brand .ladle-motion{animation:reference-pour 3s ease-in-out infinite}
.portal-brand:hover .ladle-motion{animation-duration:3s}
@keyframes reference-pour{0%,100%{transform:rotate(0deg)}45%,65%{transform:rotate(-7deg)}80%{transform:rotate(-3deg)}}
@media(max-width:600px){.portal-topbar{font-size:14px;padding:11px 16px}.portal-header-inner{padding:20px 24px 24px}.portal-header h1{font-size:25px}.portal-brand{gap:16px}.portal-brand .simec-mark{width:154px;height:64px}}
@media(prefers-reduced-motion:reduce){.portal-brand .ladle-motion{animation:none}}

.portal-brand .ladle-live{display:block;width:100px;height:100px;object-fit:contain;flex:none}

function chart(title,labels,series,{percent=false,horizontal=false,stacked=false,full=false,filterKey=null,colors=COLORS,line=false}={}){
 if(!labels.length)return panel(title,'<div class="empty">Nenhum registro para os filtros selecionados.</div>',full);
 const W=horizontal?1000:Math.max(700,labels.length*90),H=horizontal?Math.max(240,labels.length*43+50):315,left=horizontal?255:55,right=horizontal?75:20,top=25,bottom=horizontal?25:55,iw=W-left-right,ih=H-top-bottom;

function preventive(){let schedule=D.schedule.filter(r=>(!filters.month||r.month===filters.month)&&(!filters.week||r.week===filters.week));const allowed=new Set(schedule.map(r=>r.week));let control=D.control.filter(r=>allowed.has(r.week)&&(!filters.specialty||r.specialty===filters.specialty));const weeks=new Set(control.map(r=>r.week));schedule=schedule.filter(r=>weeks.has(r.week));const sum=(rows,k)=>rows.reduce((s,r)=>s+Number(r[k]||0),0),done=sum(control,'done'),cancelled=sum(control,'cancelled'),pending=sum(control,'pending'),total=done+cancelled+pending,planned=sum(schedule,'planned'),outside=sum(schedule,'outside'),rate=total?done/total:0;const labels=groups(control,'week'),series=['done','cancelled','pending'].map((key,i)=>({name:['Executado','Reprogramado','Sem status'][i],values:labels.map(l=>sum(control.filter(r=>r.week===l),key))}));const adherence=labels.map((_,i)=>{const t=series.reduce((s,x)=>s+x.values[i],0);return t?series[0].values[i]/t:0;});$('#count').textContent=num(total)+' ordens · '+labels.length+' semanas';const den=planned+outside;const donut=`<div class="donut-wrap"><div class="donut" role="img" aria-label="Programado: ${num(planned)}. Fora da programação: ${num(outside)}" style="background:conic-gradient(#004b87 0 ${den?planned/den*100:0}%,#e1c16e 0 100%)"><div class="donut-center">${den?pct(planned/den):'—'}<small>programado</small></div></div><div>${legend(['Programado','Fora da programação'],['#004b87','#e1c16e'])}<p>${num(planned)} programadas</p><p>${num(outside)} fora da programação</p></div></div>`;return '<div class="notice">Fonte: cópia de PREVENTIVA SEM 37.xlsx, usada pelo relatório original. A consecução foi reconstruída como executado ÷ (executado + cancelado + sem status), pois a medida “% Consecução Correta” não consta no PBIX.</div><div class="cards">'+metric('Quantidade de ordens',num(total),'Executado + cancelado + sem status')+metric('Programado',num(planned),'Planilha 15')+metric('Fora da programação',num(outside),'Plani function renderContent(){ $('#title').textContent=pages[page];$('#content').innerHTML=[periodic,nonperiodic,backlogOperational,backlog,preventive][page]();$('#method').innerHTML='<p>Fontes: cópias de Base de dados Power bi -.xlsm e PREVENTIVA SEM 37.xlsx. O site usa os valores salvos no Excel. Após editar e salvar as cópias, execute Atualizar dados.cmd e recarregue esta página.</p><ul><li>Periódicas: consecução = linhas executadas ÷ linhas planejadas; não executadas = ordens distintas não executadas ÷ linhas planejadas; pendentes = 1 − consecução − não executadas. Metas extraídas do PBIX: 80%, 10% e 5%.</li><li>Não periódicas: contagem distinta de ID_Ordem. O denominador dos percentuais mensais é o total dos meses selecionados (ALLSELECTED).</li><li>Backlog: ordens pendentes, descrição da ordem, flags, semana/ano e programação semanal por equipe e responsável.</li><li>Consecução de Backlog: idade média registrada na coluna Idade (Dias).</li><li>Preventiva: soma das colunas EXECUTADO, CANCELADO e SEM STATUS, vinculada à programação pela semana.</li><li>Os arquivos originais não foram alterados.</li></ul>';if($('#export-excel'))$('#export-excel').onclick=()=>window.exportOrdersXlsx(byFilter(D.periodic),filters);if($('#export-backlog'))$('#export-backlog').onclick=()=>window.exportBacklogXlsx(backlogSelection().map((r,i)=>({...r,orderDescription:orderDescription(r),tag:orderTag(r),tagDescription:ORDER_TAGS[orderTag(r)]||'',scheduledWeek:weekLabel(orderWeek(r)),...planningMeta(r,i)})));if($('#generate-program'))$('#generate-program').onclick=()=>{planningVisible=!planningVisible;renderContent();setTimeout(()=>$('#programming-output')?.scrollIntoView({behavior:'smooth',block:'start'}),50);};if($('#print-backlog'))$('#print-backlog').onclick=()=>window.print();if($('#print-program'))$('#print-program').onclick=()=>window.print();document.querySelectorAll('.order-tag').forEach(select=>select.onchange=()=>{const key='simec-backlog-tag-'+select.dataset.order;if(select.value)localStorage.setItem(key,select.value);else localStorage.removeItem(key);renderContent();});document.querySelectorAll('.order-week').forEach(select=>select.onchange=()=>{const key='simec-backlog-week-'+select.dataset.order;if(select.value)localStorage.setItem(key,select.value);else localStorage.removeItem(key);renderContent();});if($('#prev'))$('#prev').onclick=()=>{tablePage--;renderContent();};if($('#next'))$('#next').onclick=()=>{tablePage++;renderContent();};}
